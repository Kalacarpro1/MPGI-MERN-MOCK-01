<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Student Application Manager</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <h1>Student Application Manager</h1>

    <div class="form-container">
        <h2>Register New Student</h2>
        <form id="studentForm">

            <label for="studentName">Student Name</label>
            <input type="text" id="studentName" placeholder="Enter student name">
            <span class="error" id="nameError"></span>

            <label for="studentEmail">Email</label>
            <input type="email" id="studentEmail" placeholder="Enter email">
            <span class="error" id="emailError"></span>

            <label for="studentPhone">Phone Number</label>
            <input type="tel" id="studentPhone" placeholder="Enter 10 digit number">
            <span class="error" id="phoneError"></span>

            <label for="studentDob">Date of Birth</label>
            <input type="date" id="studentDob">
            <span class="error" id="dobError"></span>

            <label>Gender</label>
            <div id="genderGroup">
                <label><input type="radio" name="gender" value="Male"> Male</label>
                <label><input type="radio" name="gender" value="Female"> Female</label>
                <label><input type="radio" name="gender" value="Other"> Other</label>
            </div>
            <span class="error" id="genderError"></span>

            <label for="studentCourse">Course</label>
            <select id="studentCourse">
                <option value="">-- Select Course --</option>
                <option value="Web Development">Web Development</option>
                <option value="UI/UX">UI/UX</option>
                <option value="Python">Python</option>
                <option value="Data Analytics">Data Analytics</option>
            </select>
            <span class="error" id="courseError"></span>

            <label>Skills</label>
            <div id="skillsGroup">
                <label><input type="checkbox" value="HTML"> HTML</label>
                <label><input type="checkbox" value="CSS"> CSS</label>
                <label><input type="checkbox" value="JavaScript"> JavaScript</label>
                <label><input type="checkbox" value="Git"> Git</label>
            </div>
            <span class="error" id="skillsError"></span>

            <label for="studentAbout">About Student</label>
            <textarea id="studentAbout" placeholder="Write about the student"></textarea>
            <span class="error" id="aboutError"></span>

            <label for="studentPhoto">Profile Photo</label>
            <input type="file" id="studentPhoto" accept="image/*">
            <span class="error" id="photoError"></span>

            <button type="submit">Add Student</button>

        </form>
    </div>

    <div class="students-section">
        <h2>Registered Students</h2>
        <p>Total Students: <span id="totalStudentsCount">0</span></p>
        <div id="studentContainer"></div>
    </div>

    <div class="debug-section">
        <h2>Debug Challenge - Task 4B</h2>
        <form id="debugForm">
            <input type="text" id="debugStudentName" placeholder="Enter student name">
            <button type="submit">Add Student</button>
        </form>
        <div id="debugContainer"></div>
    </div>

    <script src="script.js"></script>
</body>
</html>
